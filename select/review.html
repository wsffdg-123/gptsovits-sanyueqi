<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三月七语音数据审查</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea; --txt: #23272e; --sub: #7a8290;
    --acc: #4f7cf0; --acc-soft: #eef3fe; --ok: #2e9e5b; --warn: #d98324; --bad: #d44;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--txt); }

  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .hrow { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .hrow:last-child { margin-bottom: 0; }
  h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
  h1 .n { color: var(--acc); }

  label.f { display: inline-flex; align-items: center; gap: 5px; color: var(--sub); font-size: 13px; }
  select, input[type=text], input[type=number] {
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; background: #fff; color: var(--txt);
  }
  input[type=text] { width: 180px; }
  input[type=number] { width: 70px; }
  input[type=checkbox] { accent-color: var(--acc); }
  button { border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; font: inherit; background: #fff; cursor: pointer; }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }

  #stats { color: var(--sub); font-size: 12px; }
  #stats b { color: var(--txt); font-weight: 600; }

  main { display: flex; height: calc(100vh - 92px); }
  #list { flex: 1; overflow-y: auto; padding: 8px 12px 40vh; }
  aside { width: 340px; border-left: 1px solid var(--line); background: var(--card); padding: 14px 16px; overflow-y: auto; }

  .row { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--card); cursor: pointer; }
  .row:hover { border-color: var(--acc); }
  .row.playing { border-color: var(--acc); background: var(--acc-soft); }
  .row .dur { flex: 0 0 48px; text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }
  .row .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .txt mark { background: #ffe9a8; padding: 0 1px; }
  .row .meta { flex: 0 0 auto; display: flex; gap: 4px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #eef0f3; color: var(--sub); white-space: nowrap; }
  .badge.t-日常平静 { background: #e8f1fd; color: #3568c9; }
  .badge.t-开心活泼 { background: #fdeee0; color: #cf6a1d; }
  .badge.t-疑问惊讶 { background: #f3ecfd; color: #7a4fd1; }
  .badge.t-温柔轻声 { background: #e6f6ee; color: #23895a; }
  .badge.t-生气紧张 { background: #fde7e7; color: #c23a3a; }
  .badge.ex { background: #f1f1f1; color: #a33; text-decoration: none; }
  .badge.s { background: #e5f3ff; color: #2277bb; }
  .badge.f0 { background: #f2f4f7; color: #667; font-variant-numeric: tabular-nums; }

  .player { position: sticky; top: 0; background: var(--card); padding-bottom: 10px; border-bottom: 1px dashed var(--line); margin-bottom: 10px; }
  .player audio { width: 100%; margin: 8px 0; }
  .player .ptxt { font-size: 15px; }
  #pTxt { width: 100%; font: 15px/1.5 inherit; font-family: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; background: #fff; color: var(--txt); }
  #pTxt:focus { outline: none; border-color: var(--acc); }
  #pTxt.dirty { border-color: var(--warn); background: #fffaf2; }
  #pTxt:disabled { background: #f2f3f5; color: var(--sub); }
  #btnSave.saved { background: var(--ok); border-color: var(--ok); color: #fff; }
  .badge.edited { background: #fff3d6; color: #a8741a; }
  .badge.rm { background: #fde7e7; color: #b03030; }
  .row.removed { opacity: .55; }
  .row.removed .txt { text-decoration: line-through; }
  .player .praw { color: var(--sub); font-size: 12px; margin-top: 4px; word-break: break-all; }
  .player .pmeta { color: var(--sub); font-size: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .keys { color: var(--sub); font-size: 12px; margin-top: 10px; }
  .keys kbd { background: #eef0f3; border-radius: 4px; padding: 0 5px; font: 11px/1.6 monospace; }
  #empty { color: var(--sub); text-align: center; padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>三月七语音审查 · <span class="n" id="shown">0</span> 条</h1>
    <span id="stats"></span>
  </div>
  <div class="hrow">
    <label class="f">清单 <select id="fSet">
      <option value="">（全部）</option>
      <option value="train30">train30</option>
      <option value="train120">train120</option>
      <option value="full">full</option>
      <option value="val">val</option>
      <option value="__excl">已排除</option>
      <option value="__removed">已移出</option>
    </select></label>
    <label class="f">分层 <select id="fTier"><option value="">（全部）</option></select></label>
    <label class="f">分组 <select id="fGroup"><option value="">（全部）</option></select></label>
    <label class="f">搜索 <input type="text" id="fText" placeholder="文本包含…"></label>
    <label class="f">时长 <input type="number" id="fDurMin" step="0.5" min="0" placeholder="≥"> –
      <input type="number" id="fDurMax" step="0.5" min="0" placeholder="≤"> 秒</label>
    <label class="f">质量≥ <input type="number" id="fQual" step="0.1" min="0" max="1" value="0"></label>
    <label class="f"><input type="checkbox" id="fHasSet"> 只看已入选</label>
    <label class="f"><input type="checkbox" id="fHighlight" checked> 高亮入选</label>
    <label class="f">排序 <select id="sortBy">
      <option value="path">文件名</option>
      <option value="dur">时长</option>
      <option value="q">质量</option>
      <option value="f0">F0</option>
      <option value="db">响度</option>
    </select></label>
    <button id="btnReset">重置</button>
  </div>
</header>

<main>
  <div id="list"><div id="empty">加载中…</div></div>
  <aside>
    <div class="player">
      <audio id="audio" controls preload="none"></audio>
      <textarea id="pTxt" rows="3" placeholder="未选择"></textarea>
      <div class="praw" id="pRaw"></div>
      <div class="pmeta" id="pMeta"></div>
      <div style="margin-top:8px">
        <button id="btnPrev">◀ 上一条</button>
        <button id="btnNext" class="primary">下一条 ▶</button>
        <button id="btnAuto">连播: 关</button>
        <button id="btnSave">保存修正 (Ctrl+S)</button>
        <button id="btnRemove">移出训练集</button>
        <button id="btnRestore" style="display:none">撤销移出</button>
      </div>
    </div>
    <div class="keys">
      快捷键：<kbd>Space</kbd> 播放/暂停 · <kbd>→</kbd>/<kbd>←</kbd> 下/上一条 ·
      <kbd>Enter</kbd> 播放当前 · <kbd>A</kbd> 连播开关 · <kbd>Ctrl+S</kbd> 保存文本修正 · <kbd>Esc</kbd> 离开输入框
    </div>
    <div class="keys">修正会即时写入 select/edits.json 并同步到 selection.csv 与四个训练清单；已在面板和列表标出「已修正」。</div>
    <div class="keys">「移出训练集」记录到 select/removals.json 并从清单移除，可随时在「已移出」视图撤销；重跑 select_data.py 时移出与修正都会被尊重。</div>
  </aside>
</main>

<script>
const DATA_URL = "/data.json";
const $ = id => document.getElementById(id);
let all = [], view = [], idx = -1, auto = false, dirty = false;
const audio = $("audio");

const SET_NAMES = { train30: "30", train120: "2h", full: "全", val: "val" };
const inSet = it => it.st && it.st.length > 0;
const setBadges = it => {
  if (!it.st) return "";
  return it.st.split(/\s+/).filter(Boolean).map(s =>
    `<span class="badge s">${SET_NAMES[s] || s}</span>`).join("");
};

function fmtDur(d) { return d >= 60 ? `${Math.floor(d/60)}:${String(Math.round(d%60)).padStart(2,"0")}` : `${d.toFixed(1)}s`; }

function apply() {
  const set = $("fSet").value, tier = $("fTier").value, grp = $("fGroup").value;
  const q = $("fText").value.trim(), dmin = +$("fDurMin").value || 0, dmax = +$("fDurMax").value || 1e9;
  const qual = +$("fQual").value || 0, onlyIn = $("fHasSet").checked;
  const kw = q.toLowerCase();
  view = all.filter(it =>
    (!set || (set === "__excl" ? (!inSet(it) && it.ex && !it.rm)
            : set === "__removed" ? it.rm
            : it.st.split(/\s+/).includes(set))) &&
    (!tier || it.ti === tier) &&
    (!grp || it.g === grp) &&
    (!kw || (it.t || "").toLowerCase().includes(kw) || it.p.toLowerCase().includes(kw)) &&
    it.d >= dmin && it.d <= dmax && it.q >= qual &&
    (!onlyIn || inSet(it))
  );
  const by = $("sortBy").value, mul = by === "path" ? 1 : -1;
  view.sort((a, b) => by === "path" ? a.p.localeCompare(b.p) : mul * ((a[by]||0) - (b[by]||0)));
  render();
  const mins = view.reduce((s, it) => s + it.d, 0) / 60;
  $("shown").textContent = view.length;
  $("stats").innerHTML = `共 ${all.length} 条 · 筛后 <b>${view.length}</b> 条 / <b>${mins.toFixed(1)}</b> 分钟`;
}

function rowHTML(it, i) {
  const hl = $("fHighlight").checked && inSet(it);
  const t = kwHighlight(it.t || "(无文本)");
  return `<div class="row${i === idx ? " playing" : ""}${hl ? "" : " dim"}${it.rm ? " removed" : ""}" data-i="${i}">
    <span class="dur">${it.d.toFixed(1)}s</span>
    <span class="txt">${t}</span>
    <span class="meta">${setBadges(it)}${it.rm ? `<span class="badge rm">已移出</span>` : ""}${it.ex && !it.rm ? `<span class="badge ex">${it.ex}</span>` : ""}
      <span class="badge t-${it.ti}">${it.ti || "?"}</span>
      <span class="badge f0">${it.f0 || "–"}Hz</span></span>
  </div>`;
}
function kwHighlight(t) {
  const kw = $("fText").value.trim();
  if (!kw) return esc(t);
  try { return esc(t).replace(new RegExp(escRe(kw), "gi"), m => `<mark>${m}</mark>`); }
  catch { return esc(t); }
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function render() {
  const box = $("list");
  if (!view.length) { box.innerHTML = `<div id="empty">无匹配数据</div>`; return; }
  const start = Math.max(0, idx - 40), end = Math.min(view.length, idx + 40);
  const near = view.slice(0, 400).map((it, i) => rowHTML(it, i)).join("");
  box.innerHTML = near + (view.length > 400 ? `<div id="empty">… 其余 ${view.length - 400} 条未渲染，请细化筛选</div>` : "");
}
function renderOne() {  // 仅更新 playing 样式
  document.querySelectorAll(".row").forEach(el =>
    el.classList.toggle("playing", +el.dataset.i === idx));
}

async function saveEdit() {
  if (idx < 0) return;
  const it = view[idx];
  const text = $("pTxt").value.trim();
  if (!text) { alert("文本不能为空"); return; }
  if (text === it.t) { $("btnSave").textContent = "无改动"; setTimeout(() => $("btnSave").textContent = "保存修正 (Ctrl+S)", 1200); return; }
  try {
    const resp = await fetch("/api/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: it.p, text }),
    });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || resp.status);
    it.t = text; it.ed = 1;
    dirty = false;
    $("pTxt").classList.remove("dirty");
    $("btnSave").classList.add("saved");
    $("btnSave").textContent = "✓ 已保存";
    setTimeout(() => { $("btnSave").classList.remove("saved"); $("btnSave").textContent = "保存修正 (Ctrl+S)"; }, 1500);
    const row = document.querySelector(`.row[data-i="${idx}"] .txt`);
    if (row) row.textContent = text;
  } catch (e) {
    alert("保存失败: " + e.message);
  }
}

$("pTxt").addEventListener("input", () => {
  dirty = $("pTxt").value !== (view[idx] ? view[idx].t : "");
  $("pTxt").classList.toggle("dirty", dirty);
});
$("btnSave").onclick = saveEdit;

async function postJSON(url, body) {
  const resp = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const j = await resp.json();
  if (!j.ok) throw new Error(j.error || resp.status);
  return j;
}

async function removeCurrent() {
  if (idx < 0) return;
  const it = view[idx];
  if (!confirm(`把这条移出训练集？\n${it.p}\n（可随时在「已移出」视图撤销）`)) return;
  try {
    await postJSON("/api/remove", { path: it.p });
    it.rm = 1; it.st = ""; it.ex = "人工移出";
    $("btnRemove").style.display = "none";
    $("btnRestore").style.display = "";
    render();
    const el = document.querySelector(`.row[data-i="${idx}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
  } catch (e) { alert("移出失败: " + e.message); }
}

async function restoreCurrent() {
  if (idx < 0) return;
  const it = view[idx];
  try {
    const j = await postJSON("/api/restore", { path: it.p });
    it.rm = 0;
    it.st = j.sets || "";
    it.ex = j.excl || "";
    $("btnRemove").style.display = "";
    $("btnRestore").style.display = "none";
    render();
    const el = document.querySelector(`.row[data-i="${idx}"]`);
    if (el) el.scrollIntoView({ block: "nearest" });
  } catch (e) { alert("撤销失败: " + e.message); }
}
$("btnRemove").onclick = removeCurrent;
$("btnRestore").onclick = restoreCurrent;

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row) play(+row.dataset.i, false);
});

function play(i, force) {
  if (i < 0 || i >= view.length) return;
  if (dirty && !confirm("当前条目有未保存的修改，丢弃并切换？")) return;
  dirty = false;
  idx = i;
  const it = view[i];
  if (force || audio.src.indexOf(encodeURIComponent(it.p)) < 0) {
    audio.src = "/" + it.p.split("/").map(encodeURIComponent).join("/");
    if (!force) audio.play().catch(()=>{});
  }
  $("pTxt").value = it.t || "";
  $("pTxt").disabled = false;
  $("pTxt").classList.remove("dirty");
  $("btnSave").classList.remove("saved");
  $("pRaw").textContent = it.r && it.r !== it.t ? "原始: " + it.r : "";
  $("btnRemove").style.display = it.rm ? "none" : "";
  $("btnRestore").style.display = it.rm ? "" : "none";
  $("pMeta").innerHTML =
    `<span class="badge">${it.p.split("/").pop()}</span>` +
    `<span class="badge">${it.g}</span>` +
    (it.ed ? `<span class="badge edited">已修正</span>` : "") +
    (it.rm ? `<span class="badge rm">已移出</span>` : "") +
    (it.st ? setBadges(it) : (it.ex && !it.rm ? `<span class="badge ex">排除: ${it.ex}</span>` : "")) +
    `<span class="badge t-${it.ti}">${it.ti || "?"}</span>` +
    `<span class="badge f0">${it.f0}Hz · ${it.db}dB · Q${it.q}</span>` +
    `<span class="badge">${(it.sr/1000).toFixed(0)}kHz</span>` +
    (it.mf ? `<span class="badge">mf</span>` : "") +
    (it.bt ? `<span class="badge ex">战斗</span>` : "") +
    (it.mem ? `<span class="badge ex">记忆体</span>` : "") +
    (it.fk ? `<span class="badge ex">仿冒</span>` : "");
  renderOne();
  const el = document.querySelector(`.row[data-i="${i}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row) play(+row.dataset.i, false);
});
audio.addEventListener("ended", () => { if (auto) play(idx + 1, false); });
$("btnPrev").onclick = () => play(idx - 1, true);
$("btnNext").onclick = () => play(idx + 1, true);
$("btnAuto").onclick = () => {
  auto = !auto;
  $("btnAuto").textContent = `连播: ${auto ? "开" : "关"}`;
  $("btnAuto").classList.toggle("primary", auto);
  if (auto && audio.paused) play(idx + 1, false);
};
["fSet","fTier","fGroup","sortBy"].forEach(id => $(id).onchange = apply);
["fDurMin","fDurMax","fQual"].forEach(id => $(id).oninput = apply);
$("fHighlight").onchange = render;
let deb;
$("fText").oninput = () => { clearTimeout(deb); deb = setTimeout(apply, 200); };
$("btnReset").onclick = () => {
  ["fText","fDurMin","fDurMax"].forEach(id => $(id).value = "");
  $("fQual").value = 0; $("fHasSet").checked = false; $("fHighlight").checked = true;
  $("fSet").value = ""; $("fTier").value = ""; $("fGroup").value = ""; $("sortBy").value = "path";
  apply();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if (e.key === "Escape") { e.target.blur(); }
    return;
  }
  if (e.target.id === "pTxt") {  // 文本编辑框内
    if (e.key === "Escape") e.target.blur();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEdit(); }
    return;  // 其余按键留给编辑
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEdit(); return; }
  if (e.code === "Space") { e.preventDefault(); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
  else if (e.key === "ArrowRight") play(idx + 1, true);
  else if (e.key === "ArrowLeft") play(idx - 1, true);
  else if (e.key === "Enter" && idx >= 0) audio.play().catch(()=>{});
  else if (e.key === "a" || e.key === "A") $("btnAuto").click();
});

fetch(DATA_URL).then(r => r.json()).then(data => {
  all = data;
  const tiers = [...new Set(data.map(x => x.ti).filter(Boolean))].sort();
  $("fTier").innerHTML = `<option value="">（全部）</option>` + tiers.map(t => `<option>${t}</option>`).join("");
  const grps = [...new Set(data.map(x => x.g))].sort();
  $("fGroup").innerHTML = `<option value="">（全部）</option>` + grps.map(g => `<option>${esc(g)}</option>`).join("");
  apply();
}).catch(err => {
  $("empty").textContent = "加载 /data.json 失败: " + err;
});
</script>
</body>
</html>
